- name: Linux
  logo: "/images/sections/skills/linux.png"
  summary: "具備 Ubuntu Linux 伺服器維運經驗，能管理後端與 GPU 運算環境，並熟悉 Shell Script 撰寫、服務設定與網路問題排查。"

- name: Git
  logo: "/images/sections/skills/git.png"
  summary: "熟悉 Git 版本控制、分支管理流程與團隊程式碼審查，具備 GitHub 與 GitLab 協作開發及自動化測試部署整合經驗。"
  url: "https://git-scm.com/"

- name: Python
  logo: "/images/sections/skills/python-logo.jpg"
  summary: "擅長使用 Python 開發後端 API、資料處理管線與 AI 應用流程，熟悉 FastAPI、gRPC、PyTorch、Pandas 及 Playwright 自動化網頁擷取。"

- name: 系統設計
  summary: "能規劃模組化微服務與事件驅動架構，熟悉 REST、gRPC 與 MQTT 通訊協定，並具備整合快取（Redis）、物件儲存（MinIO）與非同步任務佇列的經驗。"

- name: n8n
  logo: "/images/sections/skills/n8n-logo.png"
  summary: "熟悉透過 n8n 建置自動化工作流程與 Webhook 串接，能整合通訊軟體 API（如 LINE）、通知服務與大型語言模型（LLM）流程以減少重複性作業。"

- name: Google Looker Studio
  logo: "/images/sections/skills/ic_data_studio.png"
  summary: "能串接 SQL 資料庫與試算表資料來源，建立互動式資料儀表板、追蹤營運指標並自動化視覺化報表。"