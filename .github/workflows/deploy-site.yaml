name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update Hugo Modules
        run: hugo mod tidy

      - name: Install Node modules
        run: |
          hugo mod npm pack
          npm ci

      - name: Build site
        run: hugo --minify

      - name: Encrypt private slides with Staticrypt
        run: |
          npm install staticrypt
          # Find all HTML files under public/slides/ that contain data-access="private"
          find public/slides -name "*.html" -exec grep -l 'data-access="private"' {} \; | while read file; do
            npx staticrypt "$file" -p "${{ secrets.SLIDES_PASSWORD }}" \
              --template-title "🔒 Protected Content" \
              --template-instructions "Please enter the password to access this slide." \
              --template-color-primary "#4a90d9" \
              --template-color-secondary "#e8f0fe" \
              -o "$file"
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4